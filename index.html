<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Shama ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    overflow:hidden;
    color:white;
}

/* Floating Hearts */
.heart{
    position:absolute;
    color:#ff4e50;
    animation: float 6s linear infinite;
}

@keyframes float{
    0%{transform:translateY(100vh) scale(1);}
    100%{transform:translateY(-10vh) scale(1.5);}
}

.container{
    text-align:center;
    padding:40px;
    border-radius:25px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.1);
    box-shadow:0 0 40px rgba(255,0,100,0.6);
    animation: fadeIn 1.5s ease-in-out;
    position:relative;
    z-index:2;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

h1{
    font-size:28px;
    margin-bottom:20px;
    color:#ff4e50;
}

p{
    margin-bottom:30px;
    line-height:1.6;
}

button{
    padding:12px 30px;
    border:none;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    margin:10px;
    transition:0.3s;
}

#yes{
    background:#ff4e50;
    color:white;
    box-shadow:0 0 20px #ff4e50;
}

#yes:hover{
    transform:scale(1.1);
}

#no{
    background:#444;
    color:white;
    position:fixed;
}

</style>
</head>

<body>

<div class="container">
    <h1>Happy Valentine's Week Shama ❤️</h1>
    <p>
        Since you came into my life,<br>
        everything feels magical ✨<br><br>
        You are my happiness, my peace,<br>
        my forever and always 💞<br><br>
        Will you be mine forever?
    </p>

    <button id="yes" onclick="yesClicked()">YES 💖</button>
</div>

<button id="no">NO 😅</button>

<script>

const noBtn = document.getElementById("no");

/* Position NO button initially */
noBtn.style.left = "60%";
noBtn.style.top = "60%";

/* YES Click */
function yesClicked(){
    document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:black;color:white;font-size:32px;text-align:center;flex-direction:column;">
        🎆 SHE SAID YES 🎆 <br><br>
        I Love You Shama Forever 💍❤️
    </div>
    `;
}

/* Move NO button but keep inside screen */
function moveButton() {

    const buttonWidth = noBtn.offsetWidth;
    const buttonHeight = noBtn.offsetHeight;

    const maxX = window.innerWidth - buttonWidth - 10;
    const maxY = window.innerHeight - buttonHeight - 10;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
}

/* Smooth transition */
noBtn.style.transition = "0.2s ease";

/* Move when hover (desktop) */
noBtn.addEventListener("mouseover", moveButton);

/* Move when touch (mobile) */
noBtn.addEventListener("touchstart", moveButton);


/* Floating hearts generator */
setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*20+15)+"px";
    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),6000);
},400);

</script>

</body>
</html>
