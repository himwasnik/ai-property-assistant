<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI WhatsApp Assistant for Brokers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6fb;
color:#333;
}

nav{
background:#111827;
color:white;
padding:15px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

nav a{
color:white;
margin-left:20px;
text-decoration:none;
}

.hero{
text-align:center;
padding:100px 20px;
background:linear-gradient(135deg,#2563eb,#4f46e5);
color:white;
}

.hero h1{
font-size:42px;
}

.hero p{
max-width:600px;
margin:auto;
}

.btn{
padding:14px 26px;
background:white;
color:#2563eb;
border:none;
border-radius:8px;
margin-top:20px;
cursor:pointer;
}

.section{
padding:70px 20px;
text-align:center;
}

form{
max-width:400px;
margin:auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:6px;
border:1px solid #ccc;
}

button{
margin-top:15px;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
width:100%;
}

table{
width:100%;
border-collapse:collapse;
background:white;
margin-top:20px;
}

th,td{
padding:12px;
border:1px solid #ddd;
}

th{
background:#2563eb;
color:white;
}

footer{
text-align:center;
padding:20px;
background:#111827;
color:#aaa;
margin-top:40px;
}

</style>
</head>

<body>

<nav>
<div><b>AI Property Assistant</b></div>
<div>
Contact: himwasnik11@gmail.com | 8010862538
</div>
</nav>


<section class="hero">
<h1>AI WhatsApp Assistant for Brokers</h1>

<p>
Automatically reply to customer queries about plots,
land and property availability using AI on WhatsApp.
</p>

<a href="#register">
<button class="btn">Register Your WhatsApp</button>
</a>
</section>


<section class="section" id="register">

<h2>Broker Registration</h2>

<form id="brokerForm">

<input type="text" id="name" placeholder="Broker Name" required>
<input type="email" id="email" placeholder="Email" required>
<input type="tel" id="phone" placeholder="Phone Number" required>
<input type="text" id="whatsapp" placeholder="WhatsApp Number" required>

<button type="submit">Register</button>

</form>

<p id="msg"></p>

</section>


<section class="section" id="adminPanel" style="display:none">

<h2>Registered Brokers</h2>

<table>

<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>WhatsApp</th>
</tr>
</thead>

<tbody id="data"></tbody>

</table>

</section>


<footer>
© AI Property Assistant
</footer>


<script>

const form=document.getElementById("brokerForm");

form.addEventListener("submit",function(e){

e.preventDefault();

const name=document.getElementById("name").value;
const email=document.getElementById("email").value;
const phone=document.getElementById("phone").value;
const whatsapp=document.getElementById("whatsapp").value;

const broker={
name,email,phone,whatsapp
};

let brokers=JSON.parse(localStorage.getItem("brokers")) || [];

brokers.push(broker);

localStorage.setItem("brokers",JSON.stringify(brokers));

document.getElementById("msg").innerText="Registration successful!";

form.reset();

});


function loadAdmin(){

let brokers=JSON.parse(localStorage.getItem("brokers")) || [];

let html="";

brokers.forEach(b=>{

html+=`
<tr>
<td>${b.name}</td>
<td>${b.email}</td>
<td>${b.phone}</td>
<td>${b.whatsapp}</td>
</tr>
`;

});

document.getElementById("data").innerHTML=html;

}


if(window.location.search.includes("admin=true")){

document.getElementById("adminPanel").style.display="block";
loadAdmin();

}

</script>

</body>
</html>
