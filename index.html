
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Shama ❤️</title>
<style>
body {
    margin:0;
    padding:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #ff4e50, #fc913a);
    font-family: Arial, sans-serif;
    overflow:hidden;
}

.container {
    text-align:center;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    position:relative;
}

h1 {
    color:#ff4e50;
}

p {
    font-size:18px;
    margin-bottom:30px;
}

button {
    padding:12px 25px;
    font-size:16px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    margin:10px;
    transition:0.3s;
}

#yes {
    background:#ff4e50;
    color:white;
}

#yes:hover {
    background:#e63e42;
}

#no {
    background:#555;
    color:white;
    position:absolute;
}
</style>
</head>

<body>

<div class="container">
    <h1>Happy Valentine's Week Shama ❤️</h1>
    <p>
        From the day you came into my life,<br>
        everything became beautiful 🌹<br><br>
        You are my happiness, my peace, my forever 💞<br><br>
        Will you be mine forever?
    </p>

    <button id="yes" onclick="yesClicked()">YES 💖</button>
    <button id="no" onmouseover="moveNo()">NO 😅</button>
</div>

<script>
function yesClicked(){
    document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#ff4e50,#fc913a);color:white;font-size:30px;text-align:center;">
        Yaaayyyyyy ❤️❤️❤️ <br><br>
        I Love You Shama Forever 💍💖
    </div>
    `;
}

function moveNo(){
    var button = document.getElementById("no");
    var x = Math.random() * (window.innerWidth - 100);
    var y = Math.random() * (window.innerHeight - 50);
    button.style.left = x + "px";
    button.style.top = y + "px";
}
</script>

</body>
</html>
